name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Teleport publishes no Fedora repository.
        distro: [rocky10, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    env:
      # A throwaway token for the throwaway cluster, so CI can look for it in state.
      TF_VAR_join_token: ci-only-join-token-0123456789abcdefghij
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} server and node
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Two hosts on a network of their own, simplest under rootful Podman.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply the previous release, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve -var teleport_version=18.11.7
          conn3x plan -detailed-exitcode -var teleport_version=18.11.7
      # Makes a user and a short-lived identity for it on the server, then
      # runs a command on the node through the proxy: the node joined, and
      # Teleport carries a session to it.
      - name: Run a command on the node through Teleport
        run: |
          sudo podman exec -i circuit-teleport sh -eu <<'EOF'
          export PATH=/usr/local/bin:$PATH
          tctl users add ci --roles=access --logins=root >/dev/null
          tctl auth sign --user=ci --ttl=2h --out=/root/ci-identity --overwrite >/dev/null
          tctl nodes ls | grep -w node1
          tsh -i /root/ci-identity --proxy=circuit-teleport:443 ssh root@node1 cat /etc/os-release | grep -q '^ID='
          tsh -i /root/ci-identity --proxy=circuit-teleport:443 ls env=example | grep -w node1
          EOF
      - name: Upgrade to the current release, then reach the node again
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          for c in circuit-teleport circuit-teleport-node; do
            sudo podman exec $c /usr/local/bin/teleport version | grep -q 'v18\.11\.8 '
          done
          sudo podman exec -i circuit-teleport sh -eu <<'EOF'
          for _ in $(seq 60); do
            /usr/local/bin/tsh -i /root/ci-identity --proxy=circuit-teleport:443 ssh root@node1 true && exit 0
            sleep 2
          done
          exit 1
          EOF
      # The token reaches the hosts write-only, so state holds none of it, and
      # nothing Conn3x writes under .terraform does either. .terraform/modules
      # is left out: it holds downloaded module code.
      - name: Check the join token stays out of state
        working-directory: examples/local
        run: |
          if grep -rqF --exclude-dir=modules -e "$TF_VAR_join_token" terraform.tfstate .terraform/; then
            echo "The example's join token is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # Restarting the containers boots systemd again, so this checks Teleport
      # is enabled on both, and the node rejoins with the identity it holds.
      - name: Restart both hosts, then reach the node again
        run: |
          sudo podman restart circuit-teleport circuit-teleport-node
          for c in circuit-teleport circuit-teleport-node; do
            for _ in $(seq 60); do
              case $(sudo podman exec $c systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
              sleep 1
            done
            sudo podman exec $c systemctl is-active teleport
          done
          sudo podman exec -i circuit-teleport sh -eu <<'EOF'
          for _ in $(seq 90); do
            /usr/local/bin/tsh -i /root/ci-identity --proxy=circuit-teleport:443 ssh root@node1 true && exit 0
            sleep 2
          done
          exit 1
          EOF
      - name: Plan again after the restart, with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      # Once the node has joined, neither host needs the token: the node
      # deletes its copy and still reaches the server.
      - name: Switch join off, then reach the node again
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve -var join=false
          conn3x plan -detailed-exitcode -var join=false
          if sudo podman exec circuit-teleport-node test -e /etc/teleport/join-token; then exit 1; fi
          if sudo podman exec circuit-teleport test -e /etc/teleport/join-token.yaml; then exit 1; fi
          sudo podman exec -i circuit-teleport sh -eu <<'EOF'
          for _ in $(seq 60); do
            /usr/local/bin/tsh -i /root/ci-identity --proxy=circuit-teleport:443 ssh root@node1 true && exit 0
            sleep 2
          done
          exit 1
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
